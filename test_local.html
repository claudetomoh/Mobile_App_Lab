<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick API Test - Local</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin: 15px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #2196F3;
        }
        
        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: #1976D2;
        }
        
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        
        .success {
            border-left: 4px solid #4CAF50;
        }
        
        .error {
            border-left: 4px solid #F44336;
        }
        
        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <h1>🚀 Local API Tester</h1>

    <div class="box">
        <h3>Base URL Configuration</h3>
        <input type="text" id="baseUrl" value="http://169.239.251.102:280/~tomoh.ikfingeh/Mobile_App_Lab/actions/" placeholder="Your API base URL">
        <small>Testing against Ashesi live server</small>
    </div>

    <div class="box">
        <h3>1️⃣ Test: Get All Contacts</h3>
        <button onclick="testGetAll()">🔍 Get All Contacts</button>
        <div id="result1"></div>
    </div>

    <div class="box">
        <h3>2️⃣ Test: Add New Contact</h3>
        <input type="text" id="addName" placeholder="Name" value="Test User">
        <input type="text" id="addPhone" placeholder="Phone" value="+233501234567">
        <button onclick="testAdd()">➕ Add Contact</button>
        <div id="result2"></div>
    </div>

    <div class="box">
        <h3>3️⃣ Test: Get One Contact</h3>
        <input type="number" id="getOneId" placeholder="Contact ID" value="1">
        <button onclick="testGetOne()">🔍 Get Contact</button>
        <div id="result3"></div>
    </div>

    <div class="box">
        <h3>4️⃣ Test: Update Contact</h3>
        <input type="number" id="updateId" placeholder="Contact ID" value="1">
        <input type="text" id="updateName" placeholder="New Name" value="Updated Name">
        <input type="text" id="updatePhone" placeholder="New Phone" value="+233509999999">
        <button onclick="testUpdate()">✏️ Update Contact</button>
        <div id="result4"></div>
    </div>

    <div class="box">
        <h3>5️⃣ Test: Delete Contact</h3>
        <input type="number" id="deleteId" placeholder="Contact ID" value="1">
        <button onclick="testDelete()" style="background: #F44336;">🗑️ Delete Contact</button>
        <div id="result5"></div>
    </div>

    <script>
        function getBaseUrl() {
            return document.getElementById('baseUrl').value;
        }

        function showResult(divId, data, success = true) {
            const div = document.getElementById(divId);
            const className = success ? 'success' : 'error';
            div.innerHTML = `
                <div class="box ${className}" style="margin-top: 15px;">
                    <h4>${success ? '✅ Success' : '❌ Error'}</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>
            `;
        }

        async function testGetAll() {
            try {
                const response = await fetch(getBaseUrl() + 'get_all_contact_mob.php');
                const data = await response.json();
                showResult('result1', data, response.ok);
            } catch (error) {
                showResult('result1', {
                    error: error.message
                }, false);
            }
        }

        async function testAdd() {
            try {
                const response = await fetch(getBaseUrl() + 'add_contact_mob.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: document.getElementById('addName').value,
                        phone: document.getElementById('addPhone').value
                    })
                });
                const data = await response.json();
                showResult('result2', data, response.ok);
            } catch (error) {
                showResult('result2', {
                    error: error.message
                }, false);
            }
        }

        async function testGetOne() {
            try {
                const id = document.getElementById('getOneId').value;
                const response = await fetch(getBaseUrl() + `get_a_contact_mob.php?id=${id}`);
                const data = await response.json();
                showResult('result3', data, response.ok);
            } catch (error) {
                showResult('result3', {
                    error: error.message
                }, false);
            }
        }

        async function testUpdate() {
            try {
                const response = await fetch(getBaseUrl() + 'update_contact.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id: parseInt(document.getElementById('updateId').value),
                        name: document.getElementById('updateName').value,
                        phone: document.getElementById('updatePhone').value
                    })
                });
                const data = await response.json();
                showResult('result4', data, response.ok);
            } catch (error) {
                showResult('result4', {
                    error: error.message
                }, false);
            }
        }

        async function testDelete() {
            if (!confirm('Are you sure you want to delete this contact?')) return;

            try {
                const response = await fetch(getBaseUrl() + 'delete_contact.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id: parseInt(document.getElementById('deleteId').value)
                    })
                });
                const data = await response.json();
                showResult('result5', data, response.ok);
            } catch (error) {
                showResult('result5', {
                    error: error.message
                }, false);
            }
        }
    </script>
</body>

</html>
