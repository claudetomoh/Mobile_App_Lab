<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Management API Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease-out;
        }
        
        .header h1 {
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
        }
        
        .config-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }
        
        .config-box h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .config-box small {
            color: #666;
            display: block;
            margin-top: 8px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .test-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeInUp 0.6s ease-out both;
        }
        
        .test-card:nth-child(1) {
            animation-delay: 0.2s;
        }
        
        .test-card:nth-child(2) {
            animation-delay: 0.3s;
        }
        
        .test-card:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        .test-card:nth-child(4) {
            animation-delay: 0.5s;
        }
        
        .test-card:nth-child(5) {
            animation-delay: 0.6s;
        }
        
        .test-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
        }
        
        .test-card h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .test-card h3 .badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
            justify-content: center;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.delete-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        button.delete-btn:hover {
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
        }
        
        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            animation: slideIn 0.4s ease-out;
        }
        
        .result-box.success {
            background: linear-gradient(135deg, #e0f7e9 0%, #d4f1e0 100%);
            border-left: 4px solid #4CAF50;
        }
        
        .result-box.error {
            background: linear-gradient(135deg, #ffe5e5 0%, #ffd4d4 100%);
            border-left: 4px solid #F44336;
        }
        
        .result-box h4 {
            margin-bottom: 12px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .result-box.success h4 {
            color: #2e7d32;
        }
        
        .result-box.error h4 {
            color: #c62828;
        }
        
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 10px;
        }
        
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2rem;
            }
            body {
                padding: 20px 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Contact Management API</h1>
            <p>Interactive Testing Dashboard</p>
        </div>

        <div class="config-box">
            <h3>⚙️ API Configuration</h3>
            <input type="text" id="baseUrl" value="http://169.239.251.102:280/~tomoh.ikfingeh/Mobile_App_Lab/actions/" placeholder="Your API base URL">
            <small>📍 Currently testing against: <strong>Ashesi Live Server</strong></small>
        </div>

        <div class="grid">
            <div class="test-card">
                <h3><span class="badge">GET</span> Get All Contacts</h3>
                <button onclick="testGetAll()">
                    <span>🔍</span> Fetch All Contacts
                </button>
                <div id="result1"></div>
            </div>

            <div class="test-card">
                <h3><span class="badge">POST</span> Add New Contact</h3>
                <div class="input-group">
                    <label>👤 Full Name</label>
                    <input type="text" id="addName" placeholder="Enter full name" value="Test User">
                </div>
                <div class="input-group">
                    <label>📱 Phone Number</label>
                    <input type="text" id="addPhone" placeholder="+233XXXXXXXXX" value="+233501234567">
                </div>
                <button onclick="testAdd()">
                    <span>➕</span> Create Contact
                </button>
                <div id="result2"></div>
            </div>

            <div class="test-card">
                <h3><span class="badge">GET</span> Get Single Contact</h3>
                <div class="input-group">
                    <label>🔑 Contact ID</label>
                    <input type="number" id="getOneId" placeholder="Enter contact ID" value="5">
                </div>
                <button onclick="testGetOne()">
                    <span>🔍</span> Fetch Contact
                </button>
                <div id="result3"></div>
            </div>

            <div class="test-card">
                <h3><span class="badge">POST</span> Update Contact</h3>
                <div class="input-group">
                    <label>🔑 Contact ID</label>
                    <input type="number" id="updateId" placeholder="Enter contact ID" value="6">
                </div>
                <div class="input-group">
                    <label>👤 New Name</label>
                    <input type="text" id="updateName" placeholder="Enter new name" value="Updated Name">
                </div>
                <div class="input-group">
                    <label>📱 New Phone</label>
                    <input type="text" id="updatePhone" placeholder="+233XXXXXXXXX" value="+233509999999">
                </div>
                <button onclick="testUpdate()">
                    <span>✏️</span> Update Contact
                </button>
                <div id="result4"></div>
            </div>

            <div class="test-card">
                <h3><span class="badge">DELETE</span> Delete Contact</h3>
                <div class="input-group">
                    <label>🔑 Contact ID</label>
                    <input type="number" id="deleteId" placeholder="Enter contact ID" value="8">
                </div>
                <button onclick="testDelete()" class="delete-btn">
                    <span>🗑️</span> Delete Contact
                </button>
                <div id="result5"></div>
            </div>
        </div>

        <div class="footer">
            <p>💡 Mobile App Development Lab - Contact Management System</p>
        </div>
    </div>

    <script>
        function getBaseUrl() {
            return document.getElementById('baseUrl').value;
        }

        function showLoader(buttonElement) {
            buttonElement.disabled = true;
            buttonElement.innerHTML += '<span class="loader"></span>';
        }

        function hideLoader(buttonElement, originalText) {
            buttonElement.disabled = false;
            buttonElement.innerHTML = originalText;
        }

        function showResult(divId, data, success = true) {
            const div = document.getElementById(divId);
            const className = success ? 'success' : 'error';
            const icon = success ? '✅' : '❌';
            const statusText = success ? 'Success' : 'Error';

            div.innerHTML = `
                <div class="result-box ${className}">
                    <h4>${icon} ${statusText}</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>
            `;
        }

        async function testGetAll() {
            try {
                const response = await fetch(getBaseUrl() + 'get_all_contact_mob.php');
                const data = await response.json();
                showResult('result1', data, response.ok);
            } catch (error) {
                showResult('result1', {
                    error: error.message
                }, false);
            }
        }

        async function testAdd() {
            const nameInput = document.getElementById('addName').value.trim();
            const phoneInput = document.getElementById('addPhone').value.trim();

            if (!nameInput || !phoneInput) {
                showResult('result2', {
                    error: 'Name and phone are required'
                }, false);
                return;
            }

            try {
                const response = await fetch(getBaseUrl() + 'add_contact_mob.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: nameInput,
                        phone: phoneInput
                    })
                });
                const data = await response.json();
                showResult('result2', data, response.ok);

                if (response.ok) {
                    // Clear inputs on success
                    document.getElementById('addName').value = '';
                    document.getElementById('addPhone').value = '';
                }
            } catch (error) {
                showResult('result2', {
                    error: error.message
                }, false);
            }
        }

        async function testGetOne() {
            const idInput = document.getElementById('getOneId').value;

            if (!idInput) {
                showResult('result3', {
                    error: 'Contact ID is required'
                }, false);
                return;
            }

            try {
                const response = await fetch(getBaseUrl() + `get_a_contact_mob.php?id=${idInput}`);
                const data = await response.json();
                showResult('result3', data, response.ok);
            } catch (error) {
                showResult('result3', {
                    error: error.message
                }, false);
            }
        }

        async function testUpdate() {
            const idInput = document.getElementById('updateId').value;
            const nameInput = document.getElementById('updateName').value.trim();
            const phoneInput = document.getElementById('updatePhone').value.trim();

            if (!idInput || !nameInput || !phoneInput) {
                showResult('result4', {
                    error: 'All fields are required'
                }, false);
                return;
            }

            try {
                const response = await fetch(getBaseUrl() + 'update_contact.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id: parseInt(idInput),
                        name: nameInput,
                        phone: phoneInput
                    })
                });
                const data = await response.json();
                showResult('result4', data, response.ok);
            } catch (error) {
                showResult('result4', {
                    error: error.message
                }, false);
            }
        }

        async function testDelete() {
            const idInput = document.getElementById('deleteId').value;

            if (!idInput) {
                showResult('result5', {
                    error: 'Contact ID is required'
                }, false);
                return;
            }

            if (!confirm(`⚠️ Are you sure you want to delete contact #${idInput}?\n\nThis action cannot be undone.`)) {
                return;
            }

            try {
                const response = await fetch(getBaseUrl() + 'delete_contact.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id: parseInt(idInput)
                    })
                });
                const data = await response.json();
                showResult('result5', data, response.ok);

                if (response.ok) {
                    document.getElementById('deleteId').value = '';
                }
            } catch (error) {
                showResult('result5', {
                    error: error.message
                }, false);
            }
        }

        // Load all contacts on page load
        window.addEventListener('DOMContentLoaded', function() {
            testGetAll();
        });
    </script>
</body>

</html>
